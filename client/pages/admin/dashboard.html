<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Portal | Campus Facility Booking</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/main.css">
  <script type="module" src="/js/pages/admin/dashboard.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="app-header" data-app-header></header>

  <main id="main" class="app-main" tabindex="-1">
    <div class="container">
      <header class="page-header">
        <div>
          <h1 class="page-header__title">My Portal</h1>
          <p class="page-header__description">What is waiting for a decision, what is booked today and how busy this week is. All times are Korea time (KST).</p>
          <!-- Today's date, written by the script. -->
          <p class="page-header__description" id="dashboard-date"></p>
        </div>
      </header>

      <!-- Everything below is filled by js/pages/admin/dashboard.js. -->
      <div id="dashboard">
        <section aria-labelledby="stats-title">
          <h2 class="visually-hidden" id="stats-title">Key figures</h2>
          <div id="dashboard-stats"></div>
        </section>

        <section class="dash-section" aria-labelledby="academic-title">
          <div class="section-head">
            <h2 class="section-title" id="academic-title">Academic office</h2>
            <a href="/pages/admin/courses.html">Courses</a>
          </div>
          <div id="dashboard-academic"></div>
        </section>

        <section aria-labelledby="requests-title" class="dash-section">
          <div class="section-head">
            <h2 class="section-title" id="requests-title">Requests starting soonest</h2>
            <a href="/pages/admin/requests.html">Review all requests</a>
          </div>
          <div id="dashboard-requests"></div>
        </section>

        <section aria-labelledby="today-title" class="dash-section">
          <div class="section-head">
            <h2 class="section-title" id="today-title">Today's bookings</h2>
            <a href="/pages/admin/schedule.html">Open the day schedule</a>
          </div>
          <div id="dashboard-today"></div>
        </section>
      </div>
    </div>
  </main>

  <footer class="app-footer" data-app-footer></footer>
</body>
</html>
