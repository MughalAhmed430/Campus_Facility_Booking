<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courses | Campus Facility Booking</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/main.css">
  <script type="module" src="/js/pages/admin/courses.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="app-header" data-app-header></header>

  <main id="main" class="app-main" tabindex="-1">
    <div class="container">
      <header class="page-header">
        <div>
          <h1 class="page-header__title">Courses</h1>
          <p class="page-header__description">
            As the academic office, enter each semester's courses and their weekly lectures. A lecture holds its
            room like an approved booking, so students cannot reserve the room then.
          </p>
        </div>
        <div class="page-header__actions">
          <a class="btn" href="/pages/admin/professors.html">Professors</a>
          <a class="btn" href="/pages/admin/meetings.html">Counselling</a>
          <button type="button" class="btn" id="new-semester">New semester</button>
          <a class="btn btn--primary" id="new-course" href="/pages/admin/course-form.html">New course</a>
        </div>
      </header>

      <form class="toolbar" id="course-filters" role="search" aria-label="Find courses" novalidate>
        <div class="field">
          <label class="label" for="course-semester">Semester</label>
          <select class="select" id="course-semester" name="semester"></select>
        </div>
        <div class="field">
          <label class="label" for="course-q">Search</label>
          <input class="input" type="search" id="course-q" name="q" maxlength="100" autocomplete="off" aria-describedby="course-q-hint">
          <p class="hint" id="course-q-hint">Course code, title or professor.</p>
        </div>
      </form>

      <div class="page-alert" id="courses-alert"></div>
      <p class="results-count" id="courses-count" aria-live="polite"></p>
      <div id="courses"></div>
    </div>
  </main>

  <footer class="app-footer" data-app-footer></footer>
</body>
</html>
