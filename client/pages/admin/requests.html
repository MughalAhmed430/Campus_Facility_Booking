<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking requests | Campus Facility Booking</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/main.css">
  <script type="module" src="/js/pages/admin/requests.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="app-header" data-app-header></header>

  <main id="main" class="app-main" tabindex="-1">
    <div class="container">
      <header class="page-header">
        <div>
          <!-- tabindex: focus returns here when the last request has been decided -->
          <h1 class="page-header__title" id="requests-title" tabindex="-1">Booking requests</h1>
          <p class="page-header__description">Pending requests that have not started yet, soonest first. All times are Korea time (KST). Approving a request also rejects the pending requests that overlap it.</p>
          <p class="page-header__description" id="requests-count"></p>
        </div>
      </header>

      <!-- A decision that could not be saved is explained here, above the list. -->
      <div class="page-alert" id="requests-alert"></div>
      <!-- The list: filled by js/pages/admin/requests.js. -->
      <div id="requests"></div>
    </div>
  </main>

  <footer class="app-footer" data-app-footer></footer>
</body>
</html>
