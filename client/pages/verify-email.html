<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your email address | Campus Facility Booking</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/pages/auth.css">
  <script type="module" src="/js/pages/verify-email.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="app-header" data-app-header></header>

  <main id="main" class="app-main" tabindex="-1">
    <div class="container container--narrow auth">
      <div class="card">
        <!-- Opened from the link in the verification email. verify-email.js replaces this
             with the result: confirmed, already used, expired or not valid. -->
        <div class="auth-card__body" id="verify">
          <div>
            <h1 class="auth-card__title" id="verify-title">Confirming your email address</h1>
            <p class="auth-card__lead" id="verify-lead">One moment…</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="app-footer" data-app-footer></footer>
</body>
</html>
