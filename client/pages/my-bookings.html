<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My bookings | Campus Facility Booking</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/main.css">
  <script type="module" src="/js/pages/my-bookings.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="app-header" data-app-header></header>

  <main id="main" class="app-main" tabindex="-1">
    <div class="container">
      <header class="page-header">
        <div>
          <h1 class="page-header__title">My bookings</h1>
          <p class="page-header__description">Your booking requests and what happened to them. All times are Korea time (KST).</p>
        </div>
        <div class="page-header__actions">
          <a class="btn btn--primary" href="/pages/facilities.html">Book a facility</a>
        </div>
      </header>

      <!-- Problems with a cancellation appear here, above the list. -->
      <div class="page-alert" id="bookings-alert"></div>
      <!-- Tabs and the list: filled by js/pages/my-bookings.js. -->
      <div id="bookings"></div>
    </div>
  </main>

  <footer class="app-footer" data-app-footer></footer>
</body>
</html>
