<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications | Campus Facility Booking</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/main.css">
  <script type="module" src="/js/pages/notifications.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="app-header" data-app-header></header>

  <main id="main" class="app-main" tabindex="-1">
    <div class="container container--medium">
      <header class="page-header">
        <div>
          <!-- tabindex: focus returns here after "Mark all as read" -->
          <h1 class="page-header__title" id="notifications-title" tabindex="-1">Notifications</h1>
          <p class="page-header__description">What administrators decided about your booking requests, newest first. The latest 50 are shown.</p>
          <p class="page-header__description" id="notifications-count" role="status"></p>
        </div>
        <div class="page-header__actions">
          <button type="button" class="btn" id="mark-all" hidden>Mark all as read</button>
        </div>
      </header>

      <!-- A change that could not be saved is explained here, above the list. -->
      <div class="page-alert" id="notifications-alert"></div>
      <!-- The list: filled by js/pages/notifications.js. -->
      <div id="notifications"></div>
    </div>
  </main>

  <footer class="app-footer" data-app-footer></footer>
</body>
</html>
