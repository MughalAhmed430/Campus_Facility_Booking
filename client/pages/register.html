<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account | Campus Facility Booking</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/pages/auth.css">
  <script type="module" src="/js/pages/register.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="app-header" data-app-header></header>

  <main id="main" class="app-main" tabindex="-1">
    <div class="container container--narrow auth">
      <div class="card">
        <div class="auth-card__body">
          <div>
            <h1 class="auth-card__title">Create a student account</h1>
            <p class="auth-card__lead">You will use it to request rooms and follow your bookings.</p>
          </div>

          <div id="register-alert"></div>

          <form class="form" id="register-form" novalidate>
            <div class="field">
              <label class="label" for="register-name">Full name</label>
              <input class="input" id="register-name" name="fullName" autocomplete="name" maxlength="100" required>
            </div>
            <div class="field">
              <label class="label" for="register-email">Email</label>
              <input class="input" type="email" id="register-email" name="email" autocomplete="email"
                     inputmode="email" maxlength="254" required aria-describedby="register-email-hint">
              <p class="hint" id="register-email-hint">Use an address you will keep. Temporary email addresses are not accepted.</p>
            </div>
            <div class="field">
              <label class="label" for="register-student-number">
                Student number <span class="label__optional">(optional)</span>
              </label>
              <input class="input" id="register-student-number" name="studentNumber" autocomplete="off"
                     maxlength="20" aria-describedby="register-student-number-hint">
              <p class="hint" id="register-student-number-hint">4 to 20 letters or digits, as printed on your student ID.</p>
            </div>
            <div class="field">
              <label class="label" for="register-password">Password</label>
              <input class="input" type="password" id="register-password" name="password"
                     autocomplete="new-password" required aria-describedby="register-password-hint">
              <p class="hint" id="register-password-hint">At least 8 characters.</p>
            </div>
            <div class="field">
              <label class="label" for="register-confirm">Confirm password</label>
              <input class="input" type="password" id="register-confirm" name="confirmPassword"
                     autocomplete="new-password" required>
            </div>
            <button class="btn btn--primary btn--block" type="submit">Create account</button>
          </form>

          <p class="auth-card__switch">
            Already have an account? <a href="/pages/login.html" id="login-link">Sign in</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <footer class="app-footer" data-app-footer></footer>
</body>
</html>
